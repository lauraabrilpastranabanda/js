<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Salario Neto</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="js/appSalarioNeto.js"></script>
    <a href="index.html">REGRESAR</a>
</head>
<body>
    <div class="container text-center">
        <div class="display-2">Salario Neto</div>
        <table class="table">
            <tr>
                <td>Puesto</td>
                <td>Horas</td>
                <td>Años</td>
            </tr>
            <tr>
                <td>
                    <select id="puesto" class="form-control" onchange="
                        calcularSalarioNeto()">"
                        <option value="1">Gerente</option>
                        <option value="2">Secretaria</option>
                        <option value="3">Cajero</option>
                    </select>
                </td>
                <td>
                    <select id="horas" class="form-control" onchange="
                        calcularSalarioNeto()">"
                <script>
                    for (var i = 0; i <= 50; i++) {
                        document.write("<option value='"+i+"'>"+i+ 
                            "</option>");
                    }
                </script>
            </select>
        </td>
        <td>
            <select id="anios" class="form-control" onchange="
                        calcularSalarioNeto()">"
                <script>
                    for (var i = 0; i <= 40; i++) {
                        document.write("<option value='"+i+"'>"+i+ 
                        "</option>");
                    }
                </script>
            </select>
            </td>
        </tr>
        </table>
        
        <table class="table">
            <tr>
                <td colspan="2"><h2>PERCEPCIONES</h2></td>
                <td colspan="2"><h2>DEDUCCIONES</h2></td>
            </tr>
            <tr>
                <td>Sueldo Base</td>
                <td><span id="sueldoBase"></span></td>
                <td>ISR</td>
                <td><span id="ISR"></span></td>
            </tr>
            <tr>
                <td>Canasta Básica</td>
                <td><span id="canastaBasica"></span></td>
                <td>Servicio de Salud</td>
                <td><span id="servicioSalud"></span></td>
            </tr>
            <tr>
                <td>Apoyo</td>
                <td><span id="apoyo"></span></td>
                <td>Afore</td>
                <td><span id="AFORE"></span></td>
            </tr>
            <tr>
                <td>Antiguedad</td>
                <td><span id="antiguedad"></span></td>
                <td>Sindicato</td>
                <td><span id="sindicato"></span></td>
            </tr>
            <tr>
                <td>Estimulo</td>
                <td><span id="estimulo"></span></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td><h4>TOTAL PERCEPCIONES</h4></td>
                <td><span id="totalPercepciones"></span></td>
                <td><h4>TOTAL DEDUCCIONES</h4></td>
                <td><span id="totalDeducciones"></span></td>
            </tr>
            <tr>
                <td colspan="2"><h4>SALARIO NETO</h4></td>
                <td colspan="2"><span id="salarioNeto"></span></td>
            </tr>
        </table>
    </div>
</body>
</html>
